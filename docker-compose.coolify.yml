services:
  linkia:
    image: ghcr.io/joel299/link-ia:linkia-coolify
    pull_policy: always
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATA_DIR: /app/data
      CODEX_BIN: "${CODEX_BIN:-codex}"
      CODEX_HOME_ROOT: /app/data/codex-users
      SESSION_SECRET: "${SESSION_SECRET:?Defina SESSION_SECRET no Coolify}"
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      APP_BASE_URL: "${APP_BASE_URL:?Defina APP_BASE_URL no Coolify}"
      API_JWT_SECRET: "${API_JWT_SECRET:-}"
      SCALAR_DOCS_URL: "${SCALAR_DOCS_URL:-}"
      COMPOSIO_API_KEY: "${COMPOSIO_API_KEY:-}"
      COMPOSIO_GOOGLE_CALENDAR_AUTH_CONFIG_ID: "${COMPOSIO_GOOGLE_CALENDAR_AUTH_CONFIG_ID:-}"
      COMPOSIO_INSTAGRAM_AUTH_CONFIG_ID: "${COMPOSIO_INSTAGRAM_AUTH_CONFIG_ID:-}"
      COMPOSIO_TIKTOK_AUTH_CONFIG_ID: "${COMPOSIO_TIKTOK_AUTH_CONFIG_ID:-}"
      COMPOSIO_META_ADS_AUTH_CONFIG_ID: "${COMPOSIO_META_ADS_AUTH_CONFIG_ID:-}"
      META_ADS_OAUTH_REDIRECT_URI: "${META_ADS_OAUTH_REDIRECT_URI:-https://backend.composio.dev/api/v3/toolkits/auth/callback}"
      LINKIA_META_ADS_RETURN_URL: "${LINKIA_META_ADS_RETURN_URL:-}"
      COMPOSIO_META_ADS_REDIRECT_URI: "${COMPOSIO_META_ADS_REDIRECT_URI:-}"
      META_ADS_CLIENT_ID: "${META_ADS_CLIENT_ID:-}"
      META_ADS_CLIENT_SECRET: "${META_ADS_CLIENT_SECRET:-}"
      COMPOSIO_TIKTOK_ADS_AUTH_CONFIG_ID: "${COMPOSIO_TIKTOK_ADS_AUTH_CONFIG_ID:-}"
      COMPOSIO_ALLOW_LOCAL_MOCK: "${COMPOSIO_ALLOW_LOCAL_MOCK:-false}"
      ZERNIO_API_KEY: "${ZERNIO_API_KEY:-}"
      ZERNIO_API_BASE_URL: "${ZERNIO_API_BASE_URL:-https://zernio.com/api}"
      ZERNIO_WEBHOOK_SECRET: "${ZERNIO_WEBHOOK_SECRET:-}"
      ZERNIO_ALLOW_LOCAL_MOCK: "${ZERNIO_ALLOW_LOCAL_MOCK:-false}"
    volumes:
      - linkia_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  linkia_data:

